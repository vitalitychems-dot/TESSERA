name: Secret scan

# pull_request and pushes to main only. Do not add the target variant of
# pull_request: that event runs with the base repository's secrets.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel a superseded scan. Pushes to main run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # gitleaks detect walks commit history, so the clone needs every commit.
          fetch-depth: 0

      - name: Install pinned gitleaks
        # gitleaks v8.30.1 sha256 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: sh scripts/install-gitleaks.sh

      - name: Self-test seeded finding and clean tree
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: node --test scripts/gitleaks-fixture-test.mjs

      - name: Scan repository
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
        run: node scripts/gitleaks-scan.mjs
