name: self-improve
# 0-token loop: score main, record scores on branch gate-scores, open/refresh one needs-agent issue per finding.
# Writes gate-scores:scores/heartbeat.json. No workflow in this repo reads that file.
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0 # some v2 tests read git history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Tests (real log is the score source)
        env:
          NO_COLOR: "1"
        run: |
          set +e; pnpm test > test.log 2>&1; echo $? > test.exit; set -e
          tail -n 40 test.log
      - name: Bench x5 (medians)
        run: for i in 1 2 3 4 5; do node scripts/bench-latency.mjs > "bench-$i.json" || rm -f "bench-$i.json"; done
      - name: Collect scores
        run: node scripts/loop/scores.mjs collect test.log "$(cat test.exit)" bench-*.json > scores.json
      # upload v7 and download v8 are the current pair. upload has no v8. Keep them together.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scores
          path: scores.json
          retention-days: 7
  publish:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: scripts/loop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scores
      - name: Compare with last recorded scores
        run: |
          git fetch --depth 1 origin gate-scores 2>/dev/null && git show origin/gate-scores:scores/latest.json > prev.json 2>/dev/null || echo "no previous scores"
          node scripts/loop/scores.mjs compare prev.json scores.json > findings.json
          cat findings.json >> "$GITHUB_STEP_SUMMARY"
      - name: Open / refresh / close needs-agent issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create needs-agent --color B60205 --description "Self-improve finding; agents spend tokens only here" 2>/dev/null || true
          node scripts/loop/findings.mjs findings.json scores.json
      - name: Record scores + heartbeat on gate-scores
        if: github.ref == 'refs/heads/main'
        run: bash scripts/loop/record-scores.sh
