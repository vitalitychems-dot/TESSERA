name: Tessera Sovereign Mesh Synchronizer

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  sync-mesh-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Validate Local Loopback Data Integrity Boundaries
        run: |
          if grep -q "http://[0-9]" scripts/tessera-bio-hardware.mjs; then
            echo "🚨 Critical Security Deflection: Unauthorized IP strings found."
            exit 1
          fi

      - name: Deduplicate and Sync Matrix Workspace Changes
        run: |
          git config --global user.name "tessera-mesh-agent"
          git config --global user.email "mesh-agent@tessera.local"
          git pull --rebase origin main || echo "Branch matched."
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "sync: automatic matrix engine ledger synchronization loop complete"
            git push origin main
          else
            echo "No changes to sync."
          fi
