kind = "web"
previewPath = "/"
title = "Tessera"
description = "Canonical Tessera workspace with private chat and server-side developer connections."
version = "1.0.0"
id = "artifacts/z-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23518

[services.development]
run = "pnpm --filter @workspace/tessera run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tessera", "run", "build" ]
serve = "static"
publicDir = "artifacts/tessera/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23518"
BASE_PATH = "/"
