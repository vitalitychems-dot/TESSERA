openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /tessera/launch-status:
    get:
      operationId: getTesseraLaunchStatus
      summary: Public, non-secret startup status
      responses:
        "200":
          description: Startup status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TesseraLaunchStatus"
  /tessera/connections:
    get:
      operationId: getTesseraConnections
      summary: Verify server-side integrations
      responses:
        "200":
          description: Verified connection states
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TesseraConnections"
  /tessera/github:
    get:
      operationId: getTesseraGithub
      summary: Read open pull requests without changing repositories
      parameters:
        - in: query
          name: repository
          schema:
            type: string
            enum: [TESSERA, Gitbook]
      responses:
        "200":
          description: Open pull requests
          content:
            application/json:
              schema:
                type: object
                required: [repository, pulls]
                properties:
                  repository: { type: string }
                  pulls:
                    type: array
                    items:
                      type: object
                      required: [number, title, url, branch, draft]
                      properties:
                        number: { type: integer }
                        title: { type: string }
                        url: { type: string }
                        branch: { type: string }
                        draft: { type: boolean }
  /tessera/conversations:
    get:
      operationId: getTesseraConversations
      summary: List the owner's saved conversations
      responses:
        "200":
          description: Conversation history
          content:
            application/json:
              schema:
                type: object
                required: [conversations]
                properties:
                  conversations:
                    type: array
                    items:
                      $ref: "#/components/schemas/TesseraConversation"
  /tessera/conversations/{id}:
    get:
      operationId: getTesseraConversation
      summary: Read a saved conversation with its messages
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Conversation and messages
          content:
            application/json:
              schema:
                type: object
                required: [conversation, messages]
                properties:
                  conversation:
                    $ref: "#/components/schemas/TesseraConversation"
                  messages:
                    type: array
                    items:
                      type: object
                      required: [id, conversationId, role, content, createdAt]
                      properties:
                        id: { type: integer }
                        conversationId: { type: integer }
                        role: { type: string }
                        content: { type: string }
                        createdAt: { type: string, format: date-time }
  /tessera/chat:
    post:
      operationId: sendTesseraChat
      summary: Get a clearly attributed worker reply for Tessera and save both messages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                conversationId: { type: integer, minimum: 1 }
                content: { type: string, minLength: 1, maxLength: 12000 }
      responses:
        "200":
          description: Provider-reported worker reply; original Tessera runtime not verified
          content:
            application/json:
              schema:
                type: object
                required: [conversation, reply, pen, sos]
                properties:
                  conversation:
                    $ref: "#/components/schemas/TesseraConversation"
                  reply: { type: string }
                  pen:
                    type: object
                    required: [provider, model]
                    properties:
                      provider: { type: string }
                      model: { type: string }
                  sos:
                    $ref: "#/components/schemas/TesseraSOS"
        default:
          description: Explicit failure; no fabricated response
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  error: { type: string }
                  message: { type: string }
                  sos:
                    $ref: "#/components/schemas/TesseraSOS"
components:
  schemas:
    TesseraConversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: integer }
        title: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TesseraLaunchStatus:
      type: object
      required: [app, source, ownerAccessConfigured, pen, configuredModel, modelConfigured, autonomousRuntimeEnabled, heritage, sos]
      properties:
        app: { type: string }
        source: { type: string }
        ownerAccessConfigured: { type: boolean }
        pen: { type: string }
        configuredModel: { type: string }
        modelConfigured: { type: boolean }
        autonomousRuntimeEnabled: { type: boolean }
        heritage:
          $ref: "#/components/schemas/TesseraHeritage"
        sos:
          $ref: "#/components/schemas/TesseraSOS"
    TesseraSOS:
      type: object
      required: [code, message, provider, model, responder, originalVerified, repair]
      properties:
        code: { type: string }
        message: { type: string }
        provider: { type: string }
        model: { type: string }
        responder: { type: string }
        originalVerified: { type: boolean }
        repair:
          type: array
          items: { type: string }
    TesseraIdentitySource:
      type: object
      required: [label, url]
      properties:
        label: { type: string }
        url: { type: string }
    TesseraHeritage:
      type: object
      required: [name, signature, theme, lineage, glyphs, sources]
      properties:
        name: { type: string }
        signature: { type: string }
        theme: { type: string }
        lineage: { type: string }
        glyphs: { type: string }
        sources:
          type: array
          items:
            $ref: "#/components/schemas/TesseraIdentitySource"
    TesseraConnections:
      type: object
      required: [connections, model, repository]
      properties:
        model: { type: string }
        repository: { type: string }
        connections:
          type: array
          items:
            type: object
            required: [provider, connected, status, message]
            properties:
              provider: { type: string, enum: [github, model, cursor] }
              connected: { type: boolean }
              status: { type: integer }
              message: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

