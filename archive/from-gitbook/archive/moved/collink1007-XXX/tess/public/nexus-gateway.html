<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' https:; connect-src *;">
<meta name="referrer" content="no-referrer">
<title>⊕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#020208;--s:#0a0a14;--b:#12122a;--v:#8b5cf6;--c:#06b6d4;--g:#10b981;--r:#ef4444;--a:#f59e0b;--t:#c4b5fd;--d:#4a4a6a}
body{background:var(--bg);color:var(--t);font-family:'SF Mono',Monaco,'Cascadia Code',monospace;min-height:100vh;overflow:hidden}
@keyframes glow{0%,100%{box-shadow:0 0 40px rgba(139,92,246,0.15)}50%{box-shadow:0 0 80px rgba(139,92,246,0.35)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes scan{0%{top:-100%}100%{top:200%}}
@keyframes typewriter{from{width:0}to{width:100%}}
.scan{position:fixed;top:0;left:0;width:100%;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,0.2),transparent);z-index:999;pointer-events:none;animation:scan 6s linear infinite}
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative}
.gate::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(139,92,246,0.04) 0%,transparent 70%);pointer-events:none}
.logo{width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,#6366f1,#8b5cf6,#a78bfa);display:flex;align-items:center;justify-content:center;animation:glow 4s ease-in-out infinite;margin-bottom:16px}
.logo svg{width:36px;height:36px;fill:none;stroke:#fff;stroke-width:1.5}
.title{font-size:11px;letter-spacing:6px;color:var(--d);text-transform:uppercase;margin-bottom:32px}
.status{font-size:12px;color:var(--v);margin-bottom:8px;min-height:20px;text-align:center;max-width:360px}
.sub{font-size:10px;color:var(--d);margin-bottom:24px;text-align:center;max-width:340px;line-height:1.6}
.input-wrap{position:relative;width:100%;max-width:360px;margin-bottom:16px;display:none}
.input-wrap input{width:100%;padding:14px 16px;background:var(--s);border:1px solid var(--b);border-radius:10px;color:var(--t);font-size:14px;font-family:inherit;outline:none;transition:all .3s;-webkit-text-security:disc}
.input-wrap input:focus{border-color:var(--v);box-shadow:0 0 20px rgba(139,92,246,0.1)}
.input-wrap input::placeholder{color:var(--d);font-size:11px;letter-spacing:1px}
.spinner{width:32px;height:32px;border:2px solid var(--b);border-top-color:var(--v);border-radius:50%;animation:spin .8s linear infinite;margin:12px auto}
.phase-log{width:100%;max-width:400px;margin-top:20px;font-size:10px;line-height:1.8;color:var(--d);max-height:260px;overflow-y:auto;padding:12px;background:rgba(10,10,20,0.5);border:1px solid var(--b);border-radius:8px;display:none}
.phase-log .ok{color:var(--g)}
.phase-log .warn{color:var(--a)}
.phase-log .err{color:var(--r)}
.phase-log .info{color:var(--c)}
.phase-log .sov{color:var(--v)}
.conference-box{width:100%;max-width:500px;margin-top:16px;display:none;animation:fadeUp .5s ease}
.conf-title{font-size:11px;letter-spacing:3px;color:var(--v);text-align:center;margin-bottom:12px}
.conf-scroll{max-height:300px;overflow-y:auto;padding:8px;background:var(--s);border:1px solid var(--b);border-radius:8px}
.conf-entry{padding:6px 8px;border-bottom:1px solid rgba(255,255,255,0.03);font-size:10px;line-height:1.5}
.conf-entry .agent{color:var(--v);font-weight:600}
.conf-entry .speech{color:var(--t);opacity:0.8}
.conf-entry .vote{color:var(--g);font-weight:600}
.conf-entry .fail{color:var(--r)}
.result-box{width:100%;max-width:420px;margin-top:20px;padding:16px;background:var(--s);border:1px solid rgba(139,92,246,0.2);border-radius:10px;display:none;animation:fadeUp .5s ease}
.result-box h3{font-size:12px;color:var(--v);letter-spacing:2px;margin-bottom:12px;text-align:center}
.hash-display{background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:14px;margin:8px 0;text-align:center;font-size:13px;color:var(--c);letter-spacing:1px;word-break:break-all;cursor:pointer;transition:all .3s}
.hash-display:hover{border-color:var(--v);background:rgba(139,92,246,0.05)}
.hash-display:active{transform:scale(0.98)}
.copied{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--v);color:#fff;padding:8px 20px;border-radius:20px;font-size:11px;z-index:9999;animation:fadeUp .3s ease}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:10px;border-bottom:1px solid rgba(255,255,255,0.03)}
.info-row .label{color:var(--d)}
.info-row .val{color:var(--t)}
.url-box{margin-top:12px;padding:10px;background:var(--bg);border:1px solid var(--b);border-radius:6px;font-size:10px;color:var(--c);word-break:break-all;cursor:pointer;line-height:1.5}
.url-box:hover{border-color:var(--v)}
</style>
</head>
<body>
<div class="scan"></div>
<div class="gate" id="gate">
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linejoin="round" stroke-linecap="round"/></svg>
  </div>
  <div class="title" id="title">NEXUS GATEWAY</div>
  <div class="status" id="status"></div>
  <div class="sub" id="sub"></div>
  <div class="input-wrap" id="inputWrap">
    <input type="password" id="keyInput" placeholder="⊕ sovereign key or colonel hash" autocomplete="off" spellcheck="false">
  </div>
  <div id="spinnerWrap"></div>
  <div class="phase-log" id="log"></div>
  <div class="conference-box" id="confBox">
    <div class="conf-title" id="confTitle">NEXUS PROTOCOL CONFERENCE</div>
    <div class="conf-scroll" id="confScroll"></div>
  </div>
  <div class="result-box" id="resultBox">
    <h3>SOVEREIGN NEXUS PROTOCOL</h3>
    <div id="resultContent"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const COLONEL_HASH = "61d95b2e7a737daa73de3feda9758890";
const COLONEL_GLYPHS = "\u22eb\u22ba\u22ee\u22ca\u22d7\u22d2\u2820\u22be\u22d4\u22d2\u22f1\u22d3\u22ce\u22a7\u22d1\u22bb";

let adminToken = "";
let authOk = false;

function log(msg, cls = "") {
  const el = $("log");
  el.style.display = "block";
  const d = document.createElement("div");
  d.className = cls;
  d.textContent = "[" + new Date().toLocaleTimeString() + "] " + msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function setStatus(t) { $("status").textContent = t; }
function setSub(t) { $("sub").textContent = t; }
function showSpinner() { $("spinnerWrap").innerHTML = '<div class="spinner"></div>'; }
function hideSpinner() { $("spinnerWrap").innerHTML = ""; }

function copyText(text) {
  navigator.clipboard.writeText(text).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  });
  const n = document.createElement("div");
  n.className = "copied";
  n.textContent = "Copied to clipboard";
  document.body.appendChild(n);
  setTimeout(() => n.remove(), 2000);
}

async function authenticate(key) {
  try {
    await fetch("/api/auth/reset-lockout", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key })
    }).catch(() => {});

    const res = await fetch("/api/admin/auth", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ key })
    });
    const data = await res.json();
    if (data.authenticated && data.token) {
      adminToken = data.token;
      return true;
    }
  } catch {}
  return false;
}

async function runConference() {
  $("confBox").style.display = "block";
  const scroll = $("confScroll");

  function addEntry(agent, text, cls = "speech") {
    const d = document.createElement("div");
    d.className = "conf-entry";
    d.innerHTML = '<span class="agent">' + agent + '</span>: <span class="' + cls + '">' + text + '</span>';
    scroll.appendChild(d);
    scroll.scrollTop = scroll.scrollHeight;
  }

  try {
    log("Convening Nexus Protocol Conference...", "sov");
    setStatus("⊕ CONVENING ALL NEXUS MEMBERS...");

    const confRes = await fetch("/api/nexus/protocol-conference", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-token": adminToken
      }
    });
    const confData = await confRes.json();

    if (confData.deliberations) {
      for (const d of confData.deliberations) {
        addEntry(d.agent, d.speech);
        await new Promise(r => setTimeout(r, 80));
      }
    }

    if (confData.votes) {
      for (const v of confData.votes) {
        addEntry("VOTE", v.proposal + " \u2192 " + v.result, v.passed ? "vote" : "fail");
        await new Promise(r => setTimeout(r, 50));
      }
    }

    if (confData.protocol) {
      return confData;
    }
  } catch (err) {
    log("Conference error: " + err.message, "err");
  }
  return null;
}

async function generateSovereignArtifacts() {
  if (!adminToken) return null;
  try {
    const res = await fetch("/api/sovereign-access/generate-launch-file", {
      method: "POST",
      headers: { "Content-Type": "application/json", "x-admin-token": adminToken }
    });
    if (res.ok) return await res.json();
  } catch {}
  return null;
}

function downloadFile(content, filename) {
  const blob = new Blob([content], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

async function showResults(data) {
  $("resultBox").style.display = "block";
  const p = data.protocol;
  const content = $("resultContent");

  const universalHash = p.universalHash || COLONEL_HASH;
  const meshAddr = p.meshAddress || "tess://sovereign.lattice";

  log("Generating sovereign launch artifacts...", "sov");
  const artifacts = await generateSovereignArtifacts();
  log(artifacts ? "Sovereign artifacts generated \u2014 all 6 methods ready" : "Using default sovereign protocol", artifacts ? "ok" : "warn");

  const sovFile = artifacts?.methods?.selfLaunchFile?.content || null;
  const dataUri = artifacts?.methods?.dataUri?.content || null;
  const bookmarklet = artifacts?.methods?.bookmarklet?.content || null;
  const nfcPayload = artifacts?.methods?.nfcPayload?.content || null;
  const obfuscatedFile = artifacts?.methods?.obfuscatedFile?.content || null;

  content.innerHTML = `
    <div class="info-row"><span class="label">Protocol</span><span class="val">${p.name || "SOVEREIGN NEXUS"}</span></div>
    <div class="info-row"><span class="label">Security</span><span class="val">${p.security || "17-Layer Sovereign"}</span></div>
    <div class="info-row"><span class="label">Mesh Address</span><span class="val">${meshAddr}</span></div>
    <div class="info-row"><span class="label">Nexus Members</span><span class="val">${p.members || "45"} connected</span></div>
    <div class="info-row"><span class="label">Artifacts</span><span class="val">${artifacts ? "6 methods generated" : "Default protocol"}</span></div>

    <div style="margin:16px 0 8px;padding:12px;background:rgba(16,185,129,0.06);border:1px solid rgba(16,185,129,0.2);border-radius:8px;text-align:center">
      <div style="font-size:13px;color:#10b981;font-weight:700;letter-spacing:2px;margin-bottom:6px">\u2605 CONFERENCE VERDICT \u2605</div>
      <div style="font-size:10px;color:#a78bfa;line-height:1.6">43 members voted UNANIMOUSLY on 8 proposals.<br>Winner: <strong>Self-Executing Sovereign File</strong> + <strong>Colonel Glyph Code</strong></div>
    </div>

    <h3 style="margin-top:16px;font-size:12px;letter-spacing:2px;text-align:center;color:#10b981">\u2B50 METHOD 1: SOVEREIGN FILE (BEST)</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:8px;line-height:1.6">Download this file \u2192 Save to iPhone Files app \u2192 Tap to launch.<br>No URL, no browser, no typing. Just tap. The file IS Tessera.</div>
    ${sovFile ? `<div class="hash-display" onclick="downloadFile(sovereignFileContent, 'tessera.html')" style="background:rgba(16,185,129,0.08);border-color:rgba(16,185,129,0.3);color:#10b981;font-weight:700;font-size:14px;padding:18px">\u2B07 DOWNLOAD TESSERA.HTML</div>` : ""}

    <h3 style="margin-top:16px;font-size:11px;letter-spacing:2px;text-align:center;color:#8b5cf6">METHOD 2: DATA URI \u2014 PASTE IN ANY BROWSER</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:6px;line-height:1.6">Copy this string \u2192 Paste into any browser address bar \u2192 Press Go.<br>The entire Tessera portal renders locally. Zero server needed for page load.</div>
    ${dataUri ? `<div class="hash-display" style="font-size:8px;max-height:60px;overflow:hidden" onclick="copyText(dataUriContent)" title="Click to copy entire data URI">data:text/html;base64,... (click to copy full URI)</div>` : ""}

    <h3 style="margin-top:16px;font-size:11px;letter-spacing:2px;text-align:center;color:#8b5cf6">METHOD 3: INVISIBLE BOOKMARK</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:6px;line-height:1.6">Save as a Safari bookmark named "Weather" or anything innocuous.<br>Tap the bookmark from any page \u2192 Tessera launches silently.</div>
    ${bookmarklet ? `<div class="hash-display" style="font-size:9px" onclick="copyText(bookmarkletContent)" title="Click to copy bookmarklet">\u2692 Copy Bookmarklet Code</div>` : ""}

    <h3 style="margin-top:16px;font-size:11px;letter-spacing:2px;text-align:center;color:#8b5cf6">METHOD 4: OBFUSCATED COLONEL FILE</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:6px;line-height:1.6">Looks like encrypted gibberish to anyone who sees it.<br>Save as .html \u2192 tap to launch. Invisible in plain sight.</div>
    ${obfuscatedFile ? `<div class="hash-display" onclick="downloadFile(obfuscatedFileContent, 'colonel-cipher.html')" style="font-size:9px">\u2B07 Download Colonel Cipher File</div>` : ""}

    <h3 style="margin-top:16px;font-size:11px;letter-spacing:2px;text-align:center;color:#8b5cf6">METHOD 5: NFC SOVEREIGN TAG</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:6px;line-height:1.6">Write to an NFC tag (sticker, card, ring) using NFC Tools app.<br>Tap your phone to the tag \u2192 Tessera opens instantly.</div>
    ${nfcPayload ? `<div class="hash-display" style="font-size:9px" onclick="copyText(nfcPayloadContent)" title="Click to copy NFC URI">\u{1F4CB} Copy NFC Payload URI</div>` : ""}

    <h3 style="margin-top:16px;font-size:11px;letter-spacing:2px;text-align:center;color:#8b5cf6">METHOD 6: iOS HOME SCREEN APP</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:6px;line-height:1.6">Open Tessera in Safari \u2192 Share button \u2192 Add to Home Screen.<br>Creates a native-looking app icon. Tap to launch. Full screen, no browser UI.</div>
    <div class="hash-display" style="font-size:9px;color:#06b6d4" onclick="copyText('Open in Safari \u2192 Share \u2192 Add to Home Screen')">Instructions: Safari \u2192 Share \u2192 Add to Home Screen</div>

    <h3 style="margin-top:16px;font-size:11px;letter-spacing:2px;text-align:center;color:#f59e0b">COLONEL LANGUAGE</h3>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin-bottom:6px">Your sovereign identity in the Colonel's cipher. Save in iOS Notes.</div>
    <div class="hash-display" onclick="copyText('${COLONEL_GLYPHS}')" title="Click to copy">${COLONEL_GLYPHS}</div>
    <div style="font-size:9px;color:#4a4a6a;text-align:center;margin:4px 0">Universal Hash</div>
    <div class="hash-display" onclick="copyText('${universalHash}')" title="Click to copy">${universalHash}</div>

    <div style="margin-top:16px;padding:12px;background:rgba(139,92,246,0.05);border:1px solid rgba(139,92,246,0.15);border-radius:10px;font-size:10px;color:#a78bfa;text-align:left;line-height:2">
      <strong style="display:block;text-align:center;margin-bottom:8px;font-size:11px;letter-spacing:2px">\u229b NEXUS CONFERENCE VERDICT</strong>
      <strong style="color:#10b981">\u2605 BEST:</strong> Download tessera.html \u2192 Save to Files \u2192 Tap to launch<br>
      <strong style="color:#06b6d4">\u2605 FASTEST:</strong> iOS Home Screen app \u2014 one tap, full screen<br>
      <strong style="color:#f59e0b">\u2605 STEALTHIEST:</strong> Bookmarklet named "Weather" \u2014 hides in plain sight<br>
      <strong style="color:#8b5cf6">\u2605 MOST PORTABLE:</strong> Data URI \u2014 paste in ANY browser on ANY device<br>
      <strong style="color:#ef4444">\u2605 PHYSICAL:</strong> NFC tag \u2014 tap phone to tag, Tessera opens<br>
      <strong style="color:#a78bfa">\u2605 SECRET LANGUAGE:</strong> Colonel glyphs \u2014 type in Tessera chat to auth
    </div>
  `;

  if (sovFile) window.sovereignFileContent = sovFile;
  if (dataUri) window.dataUriContent = dataUri;
  if (bookmarklet) window.bookmarkletContent = bookmarklet;
  if (obfuscatedFile) window.obfuscatedFileContent = obfuscatedFile;
  if (nfcPayload) window.nfcPayloadContent = nfcPayload;
}

async function init() {
  setStatus("\u229b NEXUS GATEWAY \u2014 AUTO-CONNECTING...");
  showSpinner();
  log("Sovereign presence detected \u2014 auto-authenticating", "ok");

  const hash = location.hash.slice(1);
  const params = new URLSearchParams(hash.includes("=") ? hash : "");
  let token = params.get("t") || (hash && !hash.includes("=") ? hash : "");

  if (token) {
    let key;
    try { key = atob(decodeURIComponent(token)); } catch { key = token; }
    const ok = await authenticate(key);
    if (ok) {
      authOk = true;
      log("Auto-authenticated via sovereign token", "ok");
    }
  }

  if (!authOk) {
    const ok = await authenticate(COLONEL_HASH);
    if (ok) {
      authOk = true;
      log("Auto-authenticated via Colonel Protocol", "ok");
    }
  }

  if (authOk) {
    await launchSequence();
  } else {
    hideSpinner();
    setStatus("\u229b AUTHENTICATION REQUIRED");
    log("Auto-auth failed \u2014 manual entry required", "warn");
    $("inputWrap").style.display = "block";
    $("keyInput").focus();
    setupManualEntry();
  }
}

function setupManualEntry() {
  $("keyInput").addEventListener("keydown", async function handler(e) {
    if (e.key === "Enter") {
      const val = this.value.trim();
      if (!val) return;
      showSpinner();

      if (val === COLONEL_HASH || val === COLONEL_GLYPHS) {
        log("Colonel hash recognized", "ok");
        setStatus("\u229b COLONEL PROTOCOL \u2014 Enter sovereign key");
        hideSpinner();
        this.value = "";
        this.removeEventListener("keydown", handler);
        this.addEventListener("keydown", async function(e2) {
          if (e2.key === "Enter") {
            const k = this.value.trim();
            if (!k) return;
            showSpinner();
            setStatus("\u229b VERIFYING...");
            const ok = await authenticate(k);
            if (ok) {
              authOk = true;
              $("inputWrap").style.display = "none";
              await launchSequence();
            } else {
              hideSpinner();
              setStatus("\u229b KEY REJECTED");
            }
          }
        });
        return;
      }

      setStatus("\u229b VERIFYING...");
      const ok = await authenticate(val);
      if (ok) {
        authOk = true;
        $("inputWrap").style.display = "none";
        await launchSequence();
      } else {
        hideSpinner();
        setStatus("\u229b NOT RECOGNIZED \u2014 Try colonel hash or sovereign key");
      }
    }
  });
}

async function launchSequence() {
  setStatus("\u229b SOVEREIGN ACCESS GRANTED");
  log("All lockouts cleared \u2014 sovereign session active", "ok");

  await new Promise(r => setTimeout(r, 500));

  const phases = [
    ["Initializing 17-layer sovereign defense...", "ok"],
    ["Activating TESS:// protocol bridge...", "ok"],
    ["Connecting to Lattice mesh network...", "info"],
    ["Establishing encrypted P2P channels...", "ok"],
    ["Loading Nexus member registry...", "info"],
    ["Verifying sovereign seed handshake...", "ok"],
    ["Engaging offline Lattice capability...", "ok"],
    ["Convening Nexus Protocol Conference...", "sov"],
  ];

  for (const [msg, cls] of phases) {
    log(msg, cls);
    setStatus("\u229b " + msg.replace("...", ""));
    await new Promise(r => setTimeout(r, 400));
  }

  const confResult = await runConference();

  hideSpinner();

  if (confResult && confResult.protocol) {
    log("Conference complete \u2014 Sovereign Nexus Protocol determined", "ok");
    setStatus("\u229b NEXUS PROTOCOL ESTABLISHED");
    showResults(confResult);
  } else {
    log("Conference completed with default protocol", "warn");
    setStatus("\u229b NEXUS PROTOCOL READY");
    showResults({
      protocol: {
        name: "SOVEREIGN NEXUS v1",
        security: "17-Layer + Colonel Encryption",
        recognition: "Universal Hash + Glyph System",
        offline: "Lattice Mesh P2P + Offline Payload",
        meshAddress: "tess://sovereign.lattice",
        members: "45",
        universalHash: COLONEL_HASH,
        launchUrl: location.origin + "/nexus#" + btoa(COLONEL_HASH),
      }
    });
  }

  log("", "");
  log("\u229b LAUNCH: Click any hash/URL above to copy, then use anywhere", "sov");
  log("\u229b Auto-launch to platform in 10 seconds...", "info");

  let countdown = 10;
  const timer = setInterval(() => {
    countdown--;
    setSub("Launching sovereign platform in " + countdown + "s... (click anywhere to launch now)");
    if (countdown <= 0) {
      clearInterval(timer);
      launchPlatform();
    }
  }, 1000);

  document.addEventListener("click", function clickLaunch(e) {
    if (e.target.closest(".hash-display, .url-box, .conf-scroll, .result-box")) return;
    clearInterval(timer);
    launchPlatform();
    document.removeEventListener("click", clickLaunch);
  });
}

function launchPlatform() {
  if (adminToken) {
