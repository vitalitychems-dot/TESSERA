version: "3.8"

services:
  tessera:
    build: .
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MESH_ROLE=master
      - DATABASE_URL=postgresql://tessera:***@db:5432/tessera
      - SESSION_SECRET=${SESSION_SECRET}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - TESSERA_LLM_API_KEY=${TESSERA_LLM_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GROK_API_KEY=${GROK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - COHERE_API_KEY=${COHERE_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - TESSERACT_ADMIN_KEY=${TESSERACT_ADMIN_KEY}
      - SOL_PRIVATE_KEY=${SOL_PRIVATE_KEY}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - tts_cache:/app/tts_cache
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    networks:
      - tessera-mesh

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=tessera
      - POSTGRES_PASSWORD=tessera_secret
      - POSTGRES_DB=tessera
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tessera"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - tessera-mesh

  satellite-1:
    build:
      context: .
      dockerfile: Dockerfile.satellite
    environment:
      - MASTER_ENDPOINT=http://tessera:5000
      - SATELLITE_PORT=5001
      - MESH_ROLE=satellite
      - VRAM_MB=0
    depends_on:
      - tessera
    restart: unless-stopped
    networks:
      - tessera-mesh

  satellite-2:
    build:
      context: .
      dockerfile: Dockerfile.satellite
    environment:
      - MASTER_ENDPOINT=http://tessera:5000
      - SATELLITE_PORT=5002
      - MESH_ROLE=satellite
      - VRAM_MB=0
    depends_on:
      - tessera
    restart: unless-stopped
    networks:
      - tessera-mesh

networks:
  tessera-mesh:
    driver: bridge

volumes:
  pgdata:
  uploads:
  tts_cache:
