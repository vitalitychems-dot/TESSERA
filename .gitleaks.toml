# TESSERA secret scan. Extends the gitleaks default rules.
# Allowlists are exact captured secrets that are false positives.
# The only path exclusion is ^opened/, pending Father's direct confirmation.
# It does not cover any other path.
# The two credential-guard fixture findings are commit fingerprints in
# .gitleaksignore, not a path allowlist.

title = "TESSERA"

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic placeholders in artifacts/api-server/src/__tests__/compression-pipeline.test.ts and colonial-secret-fail-closed.test.ts. These exact strings are fail-closed test fixtures, not credentials."
regexTarget = "secret"
regexes = [
  '''^synthetic-colonial-secret-32xxxx$''',
  '''^synthetic-colonial-secret-32yyyy$''',
]

[[allowlists]]
description = "Public commit SHA of joonspk-research/generative_agents recorded in artifacts/v2/src/brain/rea/generative_agents.json. sourcegraph-access-token matches the 40-hex shape only."
regexTarget = "secret"
regexes = ['''^fe05a71d3e4ed7d10bf68aa4eda6dd995ec070f4$''']

[[allowlists]]
description = "Log category captured from archived conference prose in archive/from-gitbook/archive/moved/collink1007-XXX/{tess,x/tess}/server/routes/algorithms.ts, next to the words access_log off. The captured value is the category label, not a credential."
regexTarget = "secret"
regexes = ['''^phase-7-untraceable$''']

# Global path exclusion. gitleaks 8.30.1 rejects a top-level [allowlist] when
# [[allowlists]] is also set, so this block is the equivalent: no targetRules,
# paths only. Pending Father's direct confirmation. Revert this commit to undo.
[[allowlists]]
description = "Archive tree under opened/. Adopted pending Father's direct confirmation. This path only."
paths = ['''^opened/''']
