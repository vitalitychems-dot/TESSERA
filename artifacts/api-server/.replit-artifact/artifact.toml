kind = "api"
previewPath = "/api" # TODO - should be excluded from preview in the first place
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api", "/ws"]

[services.development]
run = "NODE_ENV=development pnpm --filter @workspace/api-server run build && NODE_ENV=development node --import ../../scripts/replit-runtime-env.mjs --enable-source-maps ./dist/index.mjs"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
# Published artifact commands run from the workspace root, unlike development.
args = ["node", "--import", "./scripts/replit-runtime-env.mjs", "--enable-source-maps", "./artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
