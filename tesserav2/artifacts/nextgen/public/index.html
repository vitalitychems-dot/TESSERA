<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Tessera next-gen</title>
<style>
body{margin:0;background:#0b0d10;color:#d7dde4;font:13px ui-monospace,monospace;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr 220px;height:100vh}
header{grid-column:1/3;padding:8px 12px;border-bottom:1px solid #222;display:flex;gap:12px;align-items:center}
section{position:relative;border:1px solid #1c2026;overflow:hidden}
h2{position:absolute;margin:6px 8px;font-size:12px;color:#8fa;z-index:2}
canvas{width:100%;height:100%;display:block}
#eye{grid-column:1/3;overflow:auto;padding:24px 8px 8px}
.wired{color:#8fa}.notwired{color:#fa8}
</style></head><body>
<header><b>Tessera next-gen</b>
<label>time t <input id="t" type="range" min="0" max="0" value="0" data-action="scrub"></label><span id="tl"></span>
<button data-action="play">play 4D</button><button data-action="refresh">refresh</button><span id="status"></span></header>
<section><h2>Brain (memory graph + synapses at t)</h2><canvas id="brain"></canvas></section>
<section><h2>World (voxel column per node; height = degree)</h2><div id="world" style="width:100%;height:100%"></div></section>
<section id="eye"><h2>Eye (bus, retrieval memory, memory log) + global workspace</h2><div id="eyelist"></div></section>
<script type="module" src="/app.js"></script>
</body></html>
