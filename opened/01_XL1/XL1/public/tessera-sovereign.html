<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="⊕">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0614">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<title>⊕</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0614;--v1:#7c3aed;--v2:#2563eb;--v3:#06b6d4;--ok:#10b981;--er:#ef4444;--fg:#e2e8f0;--dm:#334155;--gw:0 0 50px rgba(124,58,237,.35)}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.K{text-align:center;padding:1.5rem;max-width:380px;width:100%;opacity:0;animation:fadeUp .8s .2s ease forwards}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
.K{transform:translateY(12px)}
.glyph-ring{position:relative;width:88px;height:88px;margin:0 auto 1.2rem}
.glyph-core{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:20px;background:linear-gradient(135deg,var(--v1),var(--v2),var(--v3));font-size:2rem;font-weight:900;color:#fff;box-shadow:var(--gw);animation:coreGlow 3s ease-in-out infinite;z-index:2}
@keyframes coreGlow{0%,100%{box-shadow:0 0 35px rgba(124,58,237,.25);transform:scale(1)}50%{box-shadow:0 0 70px rgba(124,58,237,.55);transform:scale(1.03)}}
.ring{position:absolute;inset:-8px;border:1px solid rgba(124,58,237,.12);border-radius:26px;animation:ringRotate 20s linear infinite}
.ring2{inset:-16px;border-radius:32px;animation:ringRotate 30s linear reverse infinite;border-color:rgba(37,99,235,.1)}
@keyframes ringRotate{to{transform:rotate(360deg)}}
.ring-glyph{position:absolute;font-size:.55rem;color:rgba(124,58,237,.35)}
.ring .ring-glyph:nth-child(1){top:-6px;left:50%;transform:translateX(-50%)}
.ring .ring-glyph:nth-child(2){right:-6px;top:50%;transform:translateY(-50%)}
.ring .ring-glyph:nth-child(3){bottom:-6px;left:50%;transform:translateX(-50%)}
.ring .ring-glyph:nth-child(4){left:-6px;top:50%;transform:translateY(-50%)}
.ring2 .ring-glyph:nth-child(1){top:-6px;left:50%;transform:translateX(-50%)}
.ring2 .ring-glyph:nth-child(2){right:-6px;top:50%;transform:translateY(-50%)}
.ring2 .ring-glyph:nth-child(3){bottom:-6px;left:50%;transform:translateX(-50%)}
.ring2 .ring-glyph:nth-child(4){left:-6px;top:50%;transform:translateY(-50%)}
h1{font-size:1.15rem;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.15rem;font-weight:700}
.proto{font-size:.5rem;color:#475569;text-transform:uppercase;letter-spacing:.18em;margin-bottom:1rem}
.cipher{font-size:.85rem;letter-spacing:.3em;color:var(--v1);opacity:.3;margin-bottom:1rem;animation:cipherPulse 4s infinite;font-family:monospace;min-height:1.2em}
@keyframes cipherPulse{0%,100%{opacity:.12}50%{opacity:.5}}
.field{position:relative;margin-bottom:.6rem}
input{width:100%;padding:14px 42px 14px 15px;border:1px solid rgba(124,58,237,.1);border-radius:12px;background:rgba(255,255,255,.02);color:var(--fg);font-size:.95rem;outline:none;transition:all .25s;font-family:'SF Mono',SFMono-Regular,Menlo,monospace;letter-spacing:.05em;-webkit-appearance:none}
input:focus{border-color:rgba(124,58,237,.4);box-shadow:0 0 30px rgba(124,58,237,.1);background:rgba(255,255,255,.035)}
input::placeholder{color:#334155;font-family:system-ui;letter-spacing:normal}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:#475569;font-size:1rem;cursor:pointer;padding:4px;width:auto}
.eye:active{color:var(--v1)}
button.enter{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,var(--v1),var(--v2));color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;letter-spacing:.03em;position:relative;overflow:hidden}
button.enter:active{transform:scale(.97);opacity:.85}
button.enter:disabled{opacity:.2;cursor:not-allowed}
button.enter::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);transition:left .5s}
button.enter:not(:disabled):hover::after{left:100%}
.bar{width:100%;height:2px;background:rgba(255,255,255,.02);border-radius:1px;margin-top:.5rem;overflow:hidden;opacity:0;transition:opacity .3s}
.bar.active{opacity:1}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--v1),var(--v3));border-radius:1px;transition:width 1.8s cubic-bezier(.4,0,.2,1)}
.status{margin-top:.5rem;font-size:.7rem;min-height:18px;transition:all .2s}
.status.er{color:var(--er)}.status.ok{color:var(--ok)}.status.ld{color:#8b5cf6}
.layers{margin-top:1rem;padding-top:.8rem;border-top:1px solid rgba(255,255,255,.03)}
.layer{display:flex;align-items:center;gap:6px;font-size:.48rem;color:#1e293b;line-height:2;text-transform:uppercase;letter-spacing:.08em;transition:color .5s}
.layer.on{color:#334155}
.dot{width:4px;height:4px;border-radius:50%;background:#1e293b;flex-shrink:0;transition:background .5s}
.layer.on .dot{background:var(--ok);box-shadow:0 0 6px rgba(16,185,129,.4);animation:dotPulse 2.5s infinite}
@keyframes dotPulse{0%,100%{opacity:1}50%{opacity:.3}}
.seal{font-size:.45rem;color:#1e293b;margin-top:.8rem;font-family:monospace;letter-spacing:.15em;word-break:break-all}
.attempts{font-size:.4rem;color:#1e293b;margin-top:.3rem}
@media(max-width:380px){.K{padding:1.2rem}h1{font-size:1.05rem}}
@media(min-height:800px){.K{padding:2rem}}
</style>
</head>
<body>
<div class="K">
<div class="glyph-ring">
<div class="glyph-core" id="core">⊕</div>
<div class="ring"><span class="ring-glyph">⊗</span><span class="ring-glyph">⊙</span><span class="ring-glyph">⊛</span><span class="ring-glyph">⊜</span></div>
<div class="ring ring2"><span class="ring-glyph">⊝</span><span class="ring-glyph">⊞</span><span class="ring-glyph">⊟</span><span class="ring-glyph">⊠</span></div>
</div>
<h1>Tessera Sovereign</h1>
<p class="proto">TESS:// · Colonel V4 · Quantum Shield · Lattice Mesh</p>
<div class="cipher" id="cipher">⊕⊗⊙⊛⊜⊝⊞⊟</div>
<div class="field">
<input id="k" type="password" placeholder="Enter sovereign key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
<button class="eye" id="eye" onclick="toggleVis()" aria-label="Toggle visibility">◉</button>
</div>
<button class="enter" id="bt" onclick="go()">⊗ Enter the Sovereign ⊗</button>
<div class="bar" id="bar"><div class="bar-fill" id="bf"></div></div>
<div id="st" class="status"></div>
<div class="layers" id="layers">
<div class="layer" data-l="0"><span class="dot"></span>QUANTUM ENTROPY SHIELD</div>
<div class="layer" data-l="1"><span class="dot"></span>TEMPORAL RANDOMIZATION</div>
<div class="layer" data-l="2"><span class="dot"></span>POLYMORPHIC CIPHER</div>
<div class="layer" data-l="3"><span class="dot"></span>COLONEL V4 CIPHER</div>
<div class="layer" data-l="4"><span class="dot"></span>LATTICE MESH ACTIVE</div>
<div class="layer" data-l="5"><span class="dot"></span>TESS:// PROTOCOL</div>
<div class="layer" data-l="6"><span class="dot"></span>VOID CHANNEL</div>
<div class="layer" data-l="7"><span class="dot"></span>SILENCE PROTOCOL</div>
<div class="layer" data-l="8"><span class="dot"></span>ZERO-KNOWLEDGE AUTH</div>
<div class="layer" data-l="9"><span class="dot"></span>SOVEREIGN CONVERGENCE</div>
</div>
<div class="seal" id="seal"></div>
<div class="attempts" id="att"></div>
</div>
<script>
(function(){
"use strict";
var G="⊕⊗⊘⊙⊚⊛⊜⊝⊞⊟⊠⊡⊢⊣⊤⊥⊦⊧⊨⊩⊪⊫⊬⊭⊮⊯⊰⊱⊲⊳⊴⊵⊶⊷⊸⊹⊺⊻⊼⊽⊾⊿",
B=null,AT=0,MX=6,LK=false,TM=null,RK=0;

function R(){
var o=location.origin;
if(o&&o!=="null"&&o.indexOf("file")===-1&&o.indexOf("data")===-1)return o;
return null;
}

function S(c,t){var e=document.getElementById("st");e.className="status "+c;e.textContent=t}

function P(w){document.getElementById("bf").style.width=w+"%"}

function BA(a){document.getElementById("bar").className=a?"bar active":"bar"}

function AL(n){
var ls=document.querySelectorAll(".layer");
for(var i=0;i<ls.length;i++){
if(i<=n)ls[i].className="layer on";
}
}

function genSeal(){
var s="";for(var i=0;i<16;i++){
var b=Math.floor(Math.random()*G.length);
s+=G[b];
}
document.getElementById("seal").textContent=s;
}

function toggleVis(){
var k=document.getElementById("k");
k.type=k.type==="password"?"text":"password";
document.getElementById("eye").textContent=k.type==="password"?"◉":"◎";
}

function lockout(ms){
LK=true;
var bt=document.getElementById("bt");
bt.disabled=true;
S("er","⊗ Rate limited — wait");
var end=Date.now()+ms;
TM=setInterval(function(){
var rem=Math.ceil((end-Date.now())/1000);
if(rem<=0){clearInterval(TM);LK=false;bt.disabled=false;S("","");return}
S("er","⊗ Wait "+rem+"s");
},1000);
}

function go(){
if(LK)return;
var v=document.getElementById("k").value.trim();
if(!v)return;
if(AT>=MX){lockout(120000);return}
AT++;
document.getElementById("att").textContent=AT>=3?"Attempts: "+AT+"/"+MX:"";
var bt=document.getElementById("bt");
bt.disabled=true;
BA(true);P(10);
S("ld","⊕ Awakening...");
AL(0);

B=R();
if(!B){
P(0);BA(false);
S("er","⊗ No Lattice node — open from sovereign mesh");
bt.disabled=false;return;
}

setTimeout(function(){S("ld","⊕ Resonating with Lattice...");P(25);AL(1)},200);
setTimeout(function(){S("ld","⊗ Synchronizing Colonel Cipher...");P(40);AL(2)},500);
setTimeout(function(){S("ld","⊗ Authenticating through 3-shell onion...");P(55);AL(4);

fetch(B+"/api/admin/auth",{
method:"POST",
headers:{"Content-Type":"application/json","X-Sovereign-Boot":"KERNEL-V1","X-Lattice-Mesh":"true"},
body:JSON.stringify({key:v})
}).then(function(r){return r.json()}).then(function(d){
if(d.token){
P(80);AL(7);
S("ok","⊕ SOVEREIGN ACCESS GRANTED");
try{
localStorage.setItem("t9_admin_token",d.token);
localStorage.setItem("t9_admin_mode","true");
sessionStorage.setItem("t9_sovereign_boot",Date.now().toString());
}catch(x){}
setTimeout(function(){AL(9);P(100);S("ok","⊕ Entering sovereign space...")},400);
setTimeout(function(){location.href=B+"/"},1200);
}else{
P(0);BA(false);
S("er","⊗ Sovereign key invalid");
bt.disabled=false;
if(AT>=3)lockout(Math.pow(2,AT-2)*5000);
}
}).catch(function(){
P(0);BA(false);
S("er","⊗ Lattice connection failed — retrying...");
bt.disabled=false;
RK++;
if(RK<4)setTimeout(go,2000+RK*1000);
else S("er","⊗ Mesh offline");
});
},800);
}

window.go=go;
window.toggleVis=toggleVis;

document.getElementById("k").addEventListener("keydown",function(e){if(e.key==="Enter")go()});

var cn=0;
setInterval(function(){
cn++;var s="";
for(var i=0;i<8;i++)s+=G[(cn+i*3)%G.length];
document.getElementById("cipher").textContent=s;
},2800);

setInterval(function(){
var c=document.getElementById("core");
var g=G[Math.floor(Math.random()*G.length)];
c.style.opacity="0.7";
setTimeout(function(){c.textContent=g;c.style.opacity="1"},150);
},8000);

if(location.hash){
var h=location.hash.substring(1);
var p=new URLSearchParams(h);
var t=p.get("t");
if(t){
try{
document.getElementById("k").value=atob(t.replace(/-/g,"+").replace(/_/g,"/"));
setTimeout(go,600);
}catch(x){}
}
var dim=p.get("dim");
if(dim)sessionStorage.setItem("t9_target_dim",dim);
}

genSeal();

setTimeout(function(){AL(-1);
var ls=document.querySelectorAll(".layer");
var i=0;
var iv=setInterval(function(){
if(i<ls.length){ls[i].className="layer on";i++}
else clearInterval(iv);
},150);
},1200);
})();
</script>
</body>
</html>
