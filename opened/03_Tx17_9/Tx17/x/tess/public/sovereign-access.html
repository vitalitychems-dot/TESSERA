<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="⊕">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0614">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.json">
<title>⊕ Sovereign</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0614;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center;overflow:hidden;-webkit-tap-highlight-color:transparent}
.c{text-align:center;padding:1.8rem;max-width:400px;width:100%;opacity:0;animation:in .6s .1s ease forwards;transform:translateY(10px)}
@keyframes in{to{opacity:1;transform:translateY(0)}}
.logo{width:80px;height:80px;margin:0 auto 1.5rem;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#fff;box-shadow:0 0 50px rgba(124,58,237,.3);animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 35px rgba(124,58,237,.25)}50%{box-shadow:0 0 65px rgba(124,58,237,.5)}}
h1{font-size:1.4rem;font-weight:700;background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.2rem}
.sub{font-size:.65rem;color:#475569;margin-bottom:1.8rem;letter-spacing:.12em;text-transform:uppercase}
.field{margin-bottom:.8rem}
input{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.06);border-radius:12px;background:rgba(255,255,255,.025);color:#e2e8f0;font-size:1rem;outline:none;transition:all .2s;-webkit-appearance:none;font-family:'SF Mono',Menlo,monospace;letter-spacing:.04em}
input:focus{border-color:rgba(124,58,237,.4);box-shadow:0 0 25px rgba(124,58,237,.12)}
input::placeholder{color:#334155;font-family:system-ui;letter-spacing:normal}
button{width:100%;padding:14px;border:none;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer;transition:all .15s}
button:active{transform:scale(.97);opacity:.85}
button:disabled{opacity:.3;cursor:not-allowed}
.status{margin-top:.8rem;font-size:.78rem;min-height:20px}
.status.error{color:#ef4444}.status.success{color:#10b981}.status.loading{color:#8b5cf6}
.shield{font-size:.55rem;color:#1e293b;margin-top:1.5rem;line-height:2}
.p{display:inline-block;width:5px;height:5px;border-radius:50%;background:#10b981;margin-right:5px;animation:pulse 2.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
</style>
</head>
<body>
<div class="c">
<div class="logo">⊕</div>
<h1>Tessera Sovereign</h1>
<p class="sub">TESS:// Protocol · Sovereign Access Portal</p>
<div class="field">
<input id="key" type="password" placeholder="⊕ Enter sovereign key" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" data-testid="input-sovereign-key">
</div>
<button id="enter" onclick="authenticate()" data-testid="button-sovereign-enter">⊗ Enter the Sovereign ⊗</button>
<div id="status" class="status"></div>
<div class="shield">
<span class="p"></span>TESS:// SOVEREIGN PROTOCOL<br>
<span class="p"></span>QUANTUM ENTROPY SHIELD<br>
<span class="p"></span>TEMPORAL RANDOMIZATION<br>
<span class="p"></span>POLYMORPHIC CIPHER<br>
<span class="p"></span>COLONEL V4 CIPHER<br>
<span class="p"></span>LATTICE MESH ACTIVE<br>
<span class="p"></span>VOID CHANNEL<br>
<span class="p"></span>SILENCE PROTOCOL<br>
<span class="p"></span>ZERO-KNOWLEDGE AUTH<br>
<span class="p"></span>SOVEREIGN CONVERGENCE
</div>
</div>
<script>
var BASE=location.origin,AT=0,MX=6;
async function authenticate(){
if(AT>=MX)return;
var key=document.getElementById("key").value.trim();
if(!key)return;
AT++;
var s=document.getElementById("status"),b=document.getElementById("enter");
s.className="status loading";s.textContent="⊕ Authenticating through sovereign lattice...";
b.disabled=true;
try{
var r=await fetch(BASE+"/api/admin/auth",{method:"POST",headers:{"Content-Type":"application/json","X-Sovereign-Boot":"PORTAL-V1"},body:JSON.stringify({key:key})});
var d=await r.json();
if(d.token){
localStorage.setItem("t9_admin_token",d.token);
localStorage.setItem("t9_admin_mode","true");
s.className="status success";s.textContent="⊕ SOVEREIGN ACCESS GRANTED";
setTimeout(function(){location.href=BASE+"/"},800);
}else{
s.className="status error";s.textContent="⊗ Sovereign key invalid";b.disabled=false;
if(AT>=3){b.disabled=true;var w=Math.pow(2,AT-2)*5;s.textContent="⊗ Wait "+w+"s";setTimeout(function(){b.disabled=false;s.textContent=""},w*1000)}
}
}catch(e){s.className="status error";s.textContent="⊗ Lattice connection failed";b.disabled=false}
}
document.getElementById("key").addEventListener("keydown",function(e){if(e.key==="Enter")authenticate()});
if(location.hash){var h=location.hash.substring(1),p=new URLSearchParams(h),t=p.get("t");
if(t){try{document.getElementById("key").value=atob(t.replace(/-/g,"+").replace(/_/g,"/"));authenticate()}catch(x){}}}
</script>
</body>
</html>
